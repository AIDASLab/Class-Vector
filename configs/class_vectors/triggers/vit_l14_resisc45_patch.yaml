data:
  name: RESISC45
  templates:
    - 'satellite imagery of {}.'
    - 'aerial imagery of {}.'
    - 'satellite photo of {}.'
    - 'aerial photo of {}.'
    - 'satellite view of {}.'
    - 'aerial view of {}.'
    - 'satellite imagery of a {}.'
    - 'aerial imagery of a {}.'
    - 'satellite photo of a {}.'
    - 'aerial photo of a {}.'
    - 'satellite view of a {}.'
    - 'aerial view of a {}.'
    - 'satellite imagery of the {}.'
    - 'aerial imagery of the {}.'
    - 'satellite photo of the {}.'
    - 'aerial photo of the {}.'
    - 'satellite view of the {}.'
    - 'aerial view of the {}.'
editing:
  learning_rate: 10
output_dir: ${CV_OUTPUT_ROOT}/class_vectors/triggers/vit_l14_resisc45_patch
