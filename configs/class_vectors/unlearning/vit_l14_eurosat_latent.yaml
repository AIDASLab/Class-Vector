extends: ../vit_l14_example.yaml
model:
  finetuned_checkpoint: ${CV_CHECKPOINT_ROOT}/ViT-L-14/EuroSAT/finetuned.pt
  head_checkpoint: ${CV_CHECKPOINT_ROOT}/ViT-L-14/head_EuroSAT.pt
data:
  name: EuroSAT
  templates:
    - 'a centered satellite photo of {}.'
    - 'a centered satellite photo of a {}.'
    - 'a centered satellite photo of the {}.'
  mapping:
    split: test
    fraction: 0.05
    partition: selected
  evaluation:
    split: test
    fraction: 0.05
    partition: remainder
editing:
  learning_rate: 0.03
output_dir: ${CV_OUTPUT_ROOT}/class_vectors/unlearning/vit_l14_eurosat_latent
