extends: ../vit_b32_example.yaml
model:
  finetuned_checkpoint: ${CV_CHECKPOINT_ROOT}/ViT-B-32/MNIST/finetuned.pt
  head_checkpoint: ${CV_CHECKPOINT_ROOT}/ViT-B-32/head_MNIST.pt
data:
  name: MNIST
  templates:
    - 'a photo of the number: "{}".'
  mapping:
    split: test
    fraction: 0.01
    partition: selected
  evaluation:
    split: test
    fraction: 0.01
    partition: remainder
editing:
  learning_rate: 0.04
output_dir: ${CV_OUTPUT_ROOT}/class_vectors/unlearning/vit_b32_mnist_latent
